# Settings for team "gamma", read by live/root.hcl. Owned by the team.
# owner, cost_center and buckets are empty on purpose: checks fail until they are filled in.
owner: "team-gamma@example.com"       # contact e-mail or handle
cost_center: "cc-0003" # cost allocation
buckets:
  - { suffix: data, visibility: private }
# Who may assume the team role. "{account_id}" is resolved by live/root.hcl.
# Default = this account, access delegated to IAM policies; narrow to Terraform-managed role ARNs if needed.
trusted_principal_arns:
  - "arn:aws:iam::{account_id}:root"
tags:
  ManagedBy: terraform

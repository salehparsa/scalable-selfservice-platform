# Merge to main: apply the teams that changed since the last successful deploy, automatically.
# Module changes are not deployed here: the release workflow rolls out new module versions.
# Never destroys anything: teams removed from teams.yaml are only reported here and are
# destroyed by the separate, approver-gated offboard workflow.
#
# Changes are detected against the commit of the last *successful* deploy run (read from the
# Actions history), not just the previous commit. A failed deploy, or a queued run that GitHub
# replaced with a newer one, is therefore picked up by the next deploy.
# Run this workflow manually (Run workflow) to re-apply every team, e.g. after fixing a failure
# or after enabling AWS_CI_ENABLED.
#
# AWS auth: static access keys of the "github-ci" IAM user (GitHub secrets). That user can only
# assume the CI role (vars.AWS_CI_ROLE_ARN). OIDC would avoid long-lived keys, but this AWS
# free-tier account has no GitHub OIDC identity provider; see bootstrap/README.md.
name: deploy

on:
  push:
    branches: [main]
    paths:
      - "live/**"
      - "teams.yaml"
      - "scripts/**"
      - ".terraform-version"
      - ".terragrunt-version"
      - ".github/actions/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # One deploy at a time, never cancelled. If several merges queue up, GitHub keeps only the
  # newest pending run; that is safe because it compares with the last successful deploy.
  group: deploy
  cancel-in-progress: false

jobs:
  validate:
    name: terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - run: make validate
      - name: Module unit tests (terraform test, offline)
        run: make test-module

  changes:
    name: detect changed teams
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # to find the last successful deploy run
    outputs:
      apply: ${{ steps.detect.outputs.apply }}
      apply_batches: ${{ steps.detect.outputs.apply_batches }}
      destroy: ${{ steps.detect.outputs.destroy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, so the last deployed commit can be compared
          persist-credentials: false
      - name: Find the commit of the last successful deploy
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          sha=""
          if [ "$EVENT" = workflow_dispatch ]; then
            label="manual run: every team"
          else
            sha="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --branch main \
              --status success --limit 1 --json headSha --jq '.[0].headSha // ""')"
            label="${sha:+last successful deploy @ ${sha:0:7}}"
            label="${label:-no previous successful deploy: every team}"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"
      - id: detect
        uses: ./.github/actions/detect-changes
        with:
          base: ${{ steps.base.outputs.sha }}
          base-label: ${{ steps.base.outputs.label }}
          skip-destroy-checks: "true"

  apply:
    name: apply (${{ matrix.teams }})
    needs: [validate, changes]
    if: needs.changes.outputs.apply != '[]' && vars.AWS_CI_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production # records each deployment in the environment history
    strategy:
      fail-fast: false
      matrix:
        teams: ${{ fromJSON(needs.changes.outputs.apply_batches) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          role-duration-seconds: 3600
      - name: terragrunt apply
        env:
          TEAMS: ${{ matrix.teams }}
        run: |
          read -ra teams <<< "$TEAMS"
          scripts/run-teams.sh apply "${teams[@]}"

# Pull requests: show what a change would do to AWS. Read-only.
#   - a team edits live/team-<name>/          -> plan that team only
#   - name added to teams.yaml                -> plan the new team
#   - modules/, live/root.hcl, tool versions  -> plan every team
#   - name removed from teams.yaml            -> plan -destroy for that team (destroyed later
#                                               only by the offboard workflow)
#
# AWS auth: static access keys of the "github-ci" IAM user (GitHub secrets). That user can only
# assume the CI role (vars.AWS_CI_ROLE_ARN). OIDC would avoid long-lived keys, but this AWS
# free-tier account has no GitHub OIDC identity provider; see bootstrap/README.md.
name: plan

on:
  pull_request:
    paths:
      - "live/**"
      - "modules/**"
      - "teams.yaml"
      - "scripts/**"
      - ".terraform-version"
      - ".terragrunt-version"
      - ".github/actions/**"
      - ".github/workflows/plan.yml"

permissions:
  contents: read

concurrency:
  group: plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - run: make validate

  changes:
    name: detect changed teams
    runs-on: ubuntu-latest
    outputs:
      apply: ${{ steps.detect.outputs.apply }}
      apply_batches: ${{ steps.detect.outputs.apply_batches }}
      destroy: ${{ steps.detect.outputs.destroy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: detect
        uses: ./.github/actions/detect-changes
        with:
          base: ${{ github.event.pull_request.base.sha }}
          base-label: PR base

  plan:
    name: plan (${{ matrix.teams }})
    needs: [validate, changes]
    if: needs.changes.outputs.apply != '[]' && vars.AWS_CI_ENABLED == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        teams: ${{ fromJSON(needs.changes.outputs.apply_batches) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          role-duration-seconds: 3600
      - name: terragrunt plan
        env:
          TEAMS: ${{ matrix.teams }}
        run: |
          read -ra teams <<< "$TEAMS"
          scripts/run-teams.sh plan "${teams[@]}"

  plan-destroy:
    name: plan-destroy (${{ matrix.team }})
    needs: [validate, changes]
    if: needs.changes.outputs.destroy != '[]' && vars.AWS_CI_ENABLED == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        team: ${{ fromJSON(needs.changes.outputs.destroy) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          role-duration-seconds: 3600
      - name: terragrunt plan -destroy
        env:
          TEAM: ${{ matrix.team }}
        run: scripts/run-teams.sh plan-destroy "$TEAM"

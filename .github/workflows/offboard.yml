# Offboard (destroy) one team. The only workflow that destroys anything, kept separate from
# deploy as a safety net: it never runs on merge, only when an approver starts it.
#
# Before running: remove the team from teams.yaml in a PR and merge it (keep its
# live/team-<name>/ folder; the destroy needs it). Then: Actions -> offboard -> Run workflow,
# type the team name in both boxes.
#
# Approval: this private repository is on the GitHub Free plan, where environments can't
# require reviewers, so scripts/authorize-destroy.sh enforces it instead: the run must come
# from main, be started by a login in vars.DESTROY_APPROVERS, and both names must match.
#
# After the destroy, a bot opens a PR deleting the team's folder.
name: offboard
run-name: offboard ${{ inputs.team }}

on:
  workflow_dispatch:
    inputs:
      team:
        description: "Team to destroy (already removed from teams.yaml)"
        required: true
        type: string
      confirm:
        description: "Type the team name again to confirm"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: offboard
  cancel-in-progress: false

jobs:
  authorize:
    name: authorize
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check approver, branch, confirmation and team state
        env:
          ACTOR: ${{ github.triggering_actor }}
          APPROVERS: ${{ vars.DESTROY_APPROVERS }}
          REF: ${{ github.ref }}
          TEAM: ${{ inputs.team }}
          CONFIRM: ${{ inputs.confirm }}
        run: scripts/authorize-destroy.sh

  destroy:
    name: destroy
    needs: authorize
    if: vars.AWS_CI_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: offboarding # records each destroy in the environment history
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          role-duration-seconds: 3600
      - name: Destroy team resources and state
        env:
          TEAM: ${{ inputs.team }}
        run: scripts/offboard-team.sh "$TEAM"

  cleanup-pr:
    name: open folder cleanup PR
    needs: destroy
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Open PR deleting the team folder
        env:
          GH_TOKEN: ${{ github.token }}
          TEAM: ${{ inputs.team }}
        run: |
          set -euo pipefail
          if [ ! -d "live/team-$TEAM" ]; then
            echo "live/team-$TEAM already removed; nothing to do"
            exit 0
          fi
          branch="offboarding/remove-team-$TEAM"
          git switch -c "$branch"
          git rm -r -q "live/team-$TEAM"
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "chore: remove offboarded team folder live/team-$TEAM"
          git push --force origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$branch" \
              --title "chore: remove offboarded team $TEAM" \
              --body "Resources and state for team **$TEAM** were destroyed by run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. This removes \`live/team-$TEAM/\`. Merging it triggers no apply."
          fi

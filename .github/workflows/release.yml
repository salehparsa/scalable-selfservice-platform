# Module releases and rollout. Teams run a released version of modules/team_infrastructure, not
# the working tree, and this workflow is the only thing that moves them to a new one:
#
#   PR touching modules/**   -> techpivot/terraform-module-releaser comments the next version on
#                               the PR (semver from Conventional Commits; default: patch)
#   PR merged                -> it tags and publishes the release, then:
#                                 canary   apply the canary team(s) (live/module-versions.yaml)
#                                          with the new version; a failure stops the rollout
#                                 record   commit `default: <tag>` to main
#                                 promote  apply every team with the new version
#   Run workflow (manual)    -> the same rollout for an existing tag: rollback or roll-forward
#
# Test-only and markdown changes to the module don't produce a release (releaser defaults).
# The record step is a bot push to main; GitHub does not start other workflows for it (intended).
#
# AWS auth: static access keys of the "github-ci" IAM user (GitHub secrets). That user can only
# assume the CI role (vars.AWS_CI_ROLE_ARN). OIDC would avoid long-lived keys, but this AWS
# free-tier account has no GitHub OIDC identity provider; see bootstrap/README.md.
name: release
run-name: ${{ github.event_name == 'workflow_dispatch' && format('roll out {0}', inputs.version) || format('release PR {0} ({1})', github.event.pull_request.number, github.event.action) }}

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
    branches: [main]
    paths:
      - "modules/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Existing release tag to roll out or roll back to (see the Releases page), e.g. team_infrastructure/v1.0.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Rollouts (merge, manual) queue one at a time and are never cancelled; PR previews are
  # per PR and superseded by newer pushes.
  group: release-${{ (github.event_name == 'workflow_dispatch' || github.event.action == 'closed') && 'rollout' || format('pr-{0}', github.event.pull_request.number) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}

jobs:
  releaser:
    name: version, tag and release notes
    if: github.event_name == 'pull_request' && (github.event.action != 'closed' || github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write # push tags and create the release
      pull-requests: write # comment the next version on the PR
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Terraform Module Releaser
        id: release
        uses: techpivot/terraform-module-releaser@b5df513373777916d19dd842bf0b2b7461e7cf8f # v2.2.1
        with:
          disable-wiki: true # wikis are not available on private repositories on the Free plan
          module-path-ignore: bootstrap # a root module applied by hand, not a released module
      - name: Pick the release tag of the team module
        id: pick
        if: github.event.action == 'closed'
        env:
          MODULES: ${{ steps.release.outputs.changed-modules-map }}
        run: |
          tag="$(jq -r 'to_entries | map(select((.value.path // "") | endswith("modules/team_infrastructure"))) | .[0].value.releaseTag // ""' <<< "${MODULES:-{\}}")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release tag: ${tag:-none (nothing to release)}" >> "$GITHUB_STEP_SUMMARY"

  target:
    name: resolve version and teams
    needs: [releaser]
    if: >-
      always() && (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        || (needs.releaser.result == 'success' && needs.releaser.outputs.tag != '')
      )
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      canary: ${{ steps.resolve.outputs.canary }}
      batches: ${{ steps.resolve.outputs.batches }}
    steps:
      # main, not the merge commit: rollouts must apply the latest team configuration.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Validate the version and pick the teams
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.releaser.outputs.tag || inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^([A-Za-z0-9_.-]+/)*v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "invalid version '$VERSION'" >&2; exit 1; }
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${VERSION}" --silent || { echo "release tag '$VERSION' does not exist" >&2; exit 1; }

          canary="$(yq -r '.canary_teams // [] | join(" ")' live/module-versions.yaml)"
          [ -n "$canary" ] || { echo "canary_teams in live/module-versions.yaml must list at least one team" >&2; exit 1; }

          scripts/changed-teams.sh "" HEAD | tee "$RUNNER_TEMP/all.out"
          all="$(sed -n 's/^apply=//p' "$RUNNER_TEMP/all.out")"
          for team in $canary; do
            jq -e --arg t "$team" 'index($t) != null' <<< "$all" > /dev/null || { echo "canary team '$team' is not in teams.yaml" >&2; exit 1; }
          done

          {
            echo "version=$VERSION"
            echo "canary=$canary"
            sed -n 's/^apply_batches=/batches=/p' "$RUNNER_TEMP/all.out"
          } >> "$GITHUB_OUTPUT"
          echo "Rolling out **$VERSION**: canary team(s) $canary first, then every team." >> "$GITHUB_STEP_SUMMARY"

  canary:
    name: canary (${{ needs.target.outputs.canary }})
    needs: [target]
    if: needs.target.result == 'success' && vars.AWS_CI_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production # records each deployment in the environment history
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          role-duration-seconds: 3600
      - name: Apply the canary team(s) with the new version
        env:
          MODULE_VERSION_OVERRIDE: ${{ needs.target.outputs.version }}
          TEAMS: ${{ needs.target.outputs.canary }}
        run: |
          read -ra teams <<< "$TEAMS"
          scripts/run-teams.sh apply "${teams[@]}"

  record:
    name: record the released version
    needs: [target, canary]
    if: needs.canary.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version file to main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Commit default version to main
        env:
          VERSION: ${{ needs.target.outputs.version }}
        run: |
          set -euo pipefail
          V="$VERSION" yq -i '.default = strenv(V)' live/module-versions.yaml
          if git diff --quiet; then
            echo "$VERSION is already recorded" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -am "chore: module $VERSION passed the canary"
          for _ in 1 2 3; do
            git pull --rebase -q origin main
            if git push -q origin HEAD:main; then
              echo "Recorded **$VERSION** as the default module version." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 3
          done
          echo "could not push the version file to main" >&2
          exit 1

  promote:
    name: promote (${{ matrix.teams }})
    needs: [target, record]
    if: needs.record.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      matrix:
        teams: ${{ fromJSON(needs.target.outputs.batches) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          role-duration-seconds: 3600
      - name: Apply every team with the new version (the canary team is a no-op)
        env:
          MODULE_VERSION_OVERRIDE: ${{ needs.target.outputs.version }}
          TEAMS: ${{ matrix.teams }}
        run: |
          read -ra teams <<< "$TEAMS"
          scripts/run-teams.sh apply "${teams[@]}"

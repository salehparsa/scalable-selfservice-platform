# Repository checks that don't need Terraform or AWS: team registry consistency, tests for
# the pipeline scripts, and linting of shell scripts and workflows.
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: registry, script tests, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # yq, jq and shellcheck are preinstalled on ubuntu-latest.
      - name: teams.yaml and live/ are in sync
        run: make check-teams
      - name: Change-detection tests
        run: make test-ci
      - name: shellcheck
        run: shellcheck scripts/*.sh tests/ci/*.sh
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
